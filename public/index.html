<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视界引擎 · AI 视频创作平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23f4dcab%27/%3E%3Cstop offset=%271%27 stop-color=%27%23b8842e%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b0a08%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2717%27 fill=%27none%27 stroke=%27url(%23g)%27 stroke-width=%274%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%275.5%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    /* 主题在首帧前落定，避免浅色用户看到黑色闪屏 */
    (function () {
      try {
        var s = localStorage.getItem('vf-scheme');
        if (s !== 'light' && s !== 'dark') {
          s = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.scheme = s;
      } catch (e) { document.documentElement.dataset.scheme = 'dark'; }
    })();
  </script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <span class="bg-orb bg-orb-1"></span>
    <span class="bg-orb bg-orb-2"></span>
    <span class="bg-orb bg-orb-3"></span>
  </div>

  <div id="app" class="app hidden">
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <a class="brand" href="#/" title="返回仪表盘">
            <span class="brand-logo"><i data-lucide="clapperboard"></i></span>
            <span class="brand-text">
              <span class="brand-name">视界引擎</span>
              <span class="brand-sub">VideoForge</span>
            </span>
          </a>

          <!-- 全局导航(常规页面) -->
          <nav class="top-nav" id="topNav" aria-label="主导航">
            <a class="top-link" data-route="/" data-ico="layout-dashboard" data-label="首页" href="#/"><i data-lucide="layout-dashboard"></i><span>首页</span></a>
            <a class="top-link" data-route="/projects" data-ico="film" data-label="项目分集" href="#/projects"><i data-lucide="film"></i><span>项目分集</span></a>
            <a class="top-link" data-route="/workflow" data-ico="scroll-text" data-label="短剧工作流" href="#/workflow"><i data-lucide="scroll-text"></i><span>短剧工作流</span></a>
            <a class="top-link" data-route="/assets" data-ico="folder-open" data-label="资产库" href="#/assets"><i data-lucide="folder-open"></i><span>资产库</span></a>
            <a class="top-link" data-route="/styles" data-ico="palette" data-label="风格库" href="#/styles"><i data-lucide="palette"></i><span>风格库</span></a>
            <a class="top-link" data-route="/images" data-ico="image-plus" data-label="AI 生图" href="#/images"><i data-lucide="image-plus"></i><span>AI 生图</span></a>
            <a class="top-link nav-admin hidden" data-route="/admin" data-ico="settings" data-label="后台管理" href="#/admin"><i data-lucide="settings"></i><span>后台管理</span></a>
          </nav>
          <!-- 窄屏收纳：与主导航同一批入口 -->
          <div class="nav-more" id="navMore">
            <button class="nav-more-btn" id="navMoreBtn" title="导航"><i data-lucide="menu"></i><span>导航</span></button>
            <div class="menu-pop nav-more-pop hidden" id="navMorePop"></div>
          </div>

          <!-- 上下文区：项目 / 分集层级只承载"我在哪",动作交给页面动作行 -->
          <div class="ctx hidden" id="ctxBar">
            <a class="ctx-back" id="ctxBack" href="#"><i data-lucide="chevron-left"></i><span id="ctxBackLabel">返回</span></a>
            <div class="ctx-head">
              <span class="ctx-eyebrow" id="ctxEyebrow"></span>
              <span class="ctx-title" id="ctxTitle"></span>
            </div>
            <div class="ctx-tabs hidden" id="ctxTabs"></div>
            <span class="ctx-spacer"></span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="cmdk-trigger" id="cmdkBtn" title="快速搜索与操作 (Ctrl+K)" aria-label="命令面板">
            <i data-lucide="search"></i>
            <span class="cmdk-t-kbd"><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></span>
          </button>
          <button class="credit-chip" id="creditChip" title="积分中心 · 余额与申请">
            <i data-lucide="coins"></i><b id="creditChipVal">—</b>
          </button>
          <button class="icon-btn" id="notifBtn" title="通知"><i data-lucide="bell"></i><span class="badge hidden" id="notifBadge">0</span></button>
          <div class="notif-panel hidden" id="notifPanel"></div>
          <button class="icon-btn" id="schemeBtn" title="切换浅色 / 深色模式"></button>

          <div class="top-user" id="topUser">
            <button class="top-user-btn" id="topUserBtn" title="账号">
              <span class="avatar tu-avatar" id="topAvatar">U</span>
              <span class="tu-name" id="topUserName">—</span>
              <span class="tu-caret"><i data-lucide="chevron-down"></i></span>
            </button>
            <div class="top-user-pop hidden" id="topUserPop">
              <div class="tu-pop-head">
                <div class="tu-pop-name" id="tuName">—</div>
                <div class="tu-pop-role" id="tuRole">普通用户</div>
                <div class="tu-pop-storage">
                  <div class="storage-label"><span>存储空间</span><span id="tuStorage">0 / 0 GB</span></div>
                  <div class="storage-bar"><div class="storage-fill" id="tuStorageFill"></div></div>
                </div>
              </div>
              <button class="tu-pop-item" id="creditCenterBtn"><i data-lucide="hand-coins"></i>积分中心 · <b id="tuCredits">0</b></button>
              <button class="tu-pop-item" id="myProjectsBtn"><i data-lucide="film"></i>我的项目</button>
              <div class="tu-pop-item" id="tuStorageRow" style="cursor:default"><i data-lucide="hard-drive"></i><span id="tuStorageText">存储 —</span></div>
              <div class="ctx-sep"></div>
              <button class="tu-pop-item danger" id="topLogoutBtn"><i data-lucide="log-out"></i>退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="view"></main>
    </div>
  </div>

  <div id="authRoot" class="hidden"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/viewer.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/plink.js"></script>
  <script src="/js/credits.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/assets.js"></script>
  <script src="/js/views/styles.js"></script>
  <script src="/js/views/images.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/drama.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/cmdk.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
